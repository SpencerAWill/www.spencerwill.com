version: 2

updates:
  # GitHub Actions only. The workflows pin every action to a commit SHA (see the
  # header comment in ci.yml for why), and a pin with no update path silently
  # rots -- it keeps running a version whose security fixes never arrive. This
  # turns each bump into a reviewable PR that rewrites both the SHA and the
  # version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      actions:
        patterns: ["*"]

  # npm is deliberately absent. pnpm-workspace.yaml sets `minimumReleaseAge` to
  # 7 days as this repo's primary supply-chain defense, and Dependabot opens PRs
  # against versions the moment they publish -- every one of them would fail
  # `pnpm install --frozen-lockfile` in CI until it aged out, and the pressure
  # would be to weaken the quarantine rather than wait. Dependency bumps here are
  # done by hand, after the window.
