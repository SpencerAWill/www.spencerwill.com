name: CI

# Third-party actions are pinned to commit SHAs, not tags. A tag is a mutable
# pointer: whoever controls the action's repository can move `v4` to a new commit
# at any time, and every workflow that references it picks that up on the next
# run. Jobs here hand CLOUDFLARE_API_TOKEN and PULUMI_ACCESS_TOKEN to those
# actions, so a moved tag is a credential-exfiltration path, not a broken build.
# The trailing comment records which release each SHA was, since the SHA alone is
# unreadable. Bumping one means resolving the new SHA deliberately -- see
# .github/dependabot.yml, which raises those bumps as PRs.

# Runs on PRs and on pushes to main. The push trigger is not redundant here:
# this repo is worked on by committing straight to main, so a PR-only CI would
# almost never fire and the checks would be decorative.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  # Computed once and used as the `if:` gate on the jobs below, so a change to
  # the Pulumi program does not sit through a Vite build and vice versa.
  paths:
    name: Detect changed paths
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'biome.json'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'

  # Walks the whole lockfile, so it is not worth splitting by path.
  audit:
    name: Audit
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high --prod

  web:
    name: Web — lint, typecheck, build
    needs: paths
    if: needs.paths.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm check

      - name: Type check
        run: pnpm --filter web typecheck

      # The build is the real check. @cloudflare/vite-plugin resolves the worker
      # entry and bundles for workerd, so a Node-only import that typechecks
      # fine fails here rather than at deploy time.
      - name: Build
        run: pnpm --filter web build

  infra:
    name: Infra — lint, typecheck
    needs: paths
    if: needs.paths.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @spencerwill/infra lint

      - name: Type check
        run: pnpm --filter @spencerwill/infra typecheck

  # Read-only diff of the prod stack against live Cloudflare state.
  #
  # Runs under its own `preview` environment rather than `prod`, and that is a
  # security boundary, not bookkeeping. This is the only job a pull request can
  # trigger, and `pulumi preview` never writes anything -- so it holds a
  # Cloudflare token scoped to Read on every permission instead of Edit. The prod
  # token, which can rewrite DNS and Workers across the whole zone (ucmc included,
  # since zone is the finest granularity Cloudflare tokens support), stays
  # readable only by the two `workflow_dispatch` jobs in deploy.yml.
  #
  # Keeping the environments separate also decouples this from prod's protection
  # rules: adding a required reviewer there should not leave every PR's diff
  # sitting behind an approval nobody can see the reason for.
  #
  # Skipped for pull requests opened from a fork. This repository is public, and
  # GitHub withholds secrets from fork-originated runs by design -- the job would
  # not fail on a real problem, it would fail on an empty PULUMI_ACCESS_TOKEN, on
  # every drive-by PR. (`github.event.pull_request` is null on `push`, so the
  # comparison is vacuously true there and the job still runs on main.)
  pulumi-preview:
    name: Pulumi preview (prod)
    needs: [paths, infra]
    if: >-
      needs.paths.outputs.infra == 'true' &&
      github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: pulumi-preview-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          command: preview
          stack-name: prod
          work-dir: infra
          comment-on-pr: true
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
