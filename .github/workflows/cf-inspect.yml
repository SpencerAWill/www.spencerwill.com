name: Inspect Cloudflare

# Temporary, single-purpose utility: prints the zone's dynamic-redirect
# entrypoint ruleset so its ID can be written into infra/index.ts as a Pulumi
# `import` target. Delete this file once the ruleset is adopted.
#
# It exists because a GitHub secret cannot be read back out -- there is no read
# API and no `gh secret get`, by design. Rather than trying to recover the token
# value (which would mean defeating log masking and printing a live credential
# into a public repository's logs), this uses the secret where it already lives
# and emits only the non-sensitive result.
#
# Runs under `preview`, so it holds the Read-only Cloudflare token, not the one
# that can edit DNS and Workers.
on:
  workflow_dispatch:

jobs:
  rulesets:
    name: List dynamic redirect rulesets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: preview
    permissions:
      contents: read
    steps:
      - name: Fetch the dynamic-redirect entrypoint ruleset
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_ID: 6bfb4d1d3134e6d765aef413094cd28f
        # No `set -x`: tracing would echo the Authorization header. The token is
        # passed to curl through the environment and never printed; everything
        # this writes to the log (ruleset id, rule expressions) is zone
        # configuration, not a credential.
        run: |
          set -euo pipefail

          rulesets=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/rulesets?per_page=100")

          id=$(echo "$rulesets" | jq -r '
            .result[]
            | select(.phase == "http_request_dynamic_redirect")
            | .id' | head -1)

          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "No http_request_dynamic_redirect ruleset found."
            echo "$rulesets" | jq -r '.result[] | "\(.phase)\t\(.kind)\t\(.id)"'
            exit 1
          fi

          echo "==================== IMPORT TARGET ===================="
          echo "RULESET_ID: ${id}"
          echo "PULUMI_IMPORT_ID: ${ZONE_ID}/${id}"
          echo "======================================================="
          echo

          echo "----- ruleset metadata -----"
          echo "$rulesets" | jq '.result[] | select(.id == "'"${id}"'")
            | {id, name, kind, phase, description, last_updated}'

          echo "----- rules in this ruleset -----"
          curl -sS --fail-with-body \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/rulesets/${id}" \
          | jq '.result.rules'
